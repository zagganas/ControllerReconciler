# This rule is not used by the project controllerreconciler itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over zagganas.com.zagganas.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: controllerreconciler
    app.kubernetes.io/managed-by: kustomize
  name: controller-admin-role
rules:
- apiGroups:
  - zagganas.com.zagganas.com
  resources:
  - controllers
  verbs:
  - '*'
- apiGroups:
  - zagganas.com.zagganas.com
  resources:
  - controllers/status
  verbs:
  - get
